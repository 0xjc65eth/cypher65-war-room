operations:
  - name: restart
    method: POST
    path: /api/system/restart
    fidelity: source
    source_ref: ESP-Miner OpenAPI paths./api/system/restart
    response: GenericResponse object with required string message
    simulator_policy: disabled in default E2E; optional state transition may return local synthetic ACK only
  - name: pause
    method: POST
    path: /api/system/pause
    fidelity: source
    source_ref: ESP-Miner OpenAPI paths./api/system/pause
    response: GenericResponse object with required string message
  - name: resume
    method: POST
    path: /api/system/resume
    fidelity: source
    source_ref: ESP-Miner OpenAPI paths./api/system/resume
    response: GenericResponse object with required string message
  - name: configure
    method: PATCH
    path: /api/system
    fidelity: source
    source_ref: ESP-Miner OpenAPI paths./api/system
    response: UpdateSettingsResponse schema
    evidence: Settings request schema has additionalProperties true; exact field effect and behavior remain firmware-dependent
versions:
  - version: ESP-Miner current upstream OpenAPI at access time
    source_ref: above
    fixtures: none captured
  - version: older / forked AxeOS variants
    fidelity: assumed
    notes: key presence, types, and extensions can vary; no cross-version contract is claimed
limits:
  - schema source confirms declared contract, not actual emitted payload for each device/firmware combination
  - no chip-count-specific physical rates, power/thermal calibration, pool connectivity, DHCP or LAN behavior is certified
