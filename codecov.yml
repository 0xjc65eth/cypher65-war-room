# Codecov config — CYPHER65 War Room
# Reference: https://docs.codecov.com/docs/codecov-yaml
#
# A cobertura é gerada no CI (pytest --cov) e enviada pelo codecov-action
# (token: ${{ secrets.CODECOV_TOKEN }}). O gate local já existe
# (--cov-fail-under=65); este arquivo replica o mesmo threshold no Codecov
# para o comentário de PR e o status check.

codecov:
  require_ci_to_pass: true   # CI vermelho bloqueia o status do Codecov
  notify:
    wait_for_ci: true

coverage:
  status:
    project:
      default:
        target: 65%          # mesmo gate do pytest --cov-fail-under=65
        threshold: 1%        # tolerância de flutuação entre ambientes
        informational: false # falha abaixo do target → status vermelho
    patch:
      default:
        target: 65%
        informational: true  # patch não bloqueia (repo pequeno, varia muito)

comment:
  layout: "header, diff, files, footer"
  behavior: default
  require_changes: false     # comenta em todo PR que muda cobertura
