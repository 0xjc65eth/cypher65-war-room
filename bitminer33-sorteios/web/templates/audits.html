<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>AUDITORIAS — BITMINER33</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: #00ff9f; font-family: 'Courier New', monospace; }
        .panel { background: #001100; border: 2px solid #003300; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-8">AUDITORIAS PÚBLICAS</h1>
        
        <div class="panel p-6">
            {% if audits %}
                <div class="space-y-2">
                    {% for audit in audits %}
                    <div class="bg-black border border-green-800 px-4 py-3 font-mono text-sm">
                        {{ audit }}
                    </div>
                    {% endfor %}
                </div>
            {% else %}
                <p class="text-green-600">Nenhuma auditoria encontrada ainda.</p>
            {% endif %}
        </div>

        <div class="mt-8 text-center">
            <a href="/" class="bg-green-900 hover:bg-green-800 px-8 py-3 inline-block">VOLTAR</a>
        </div>
    </div>
</body>
</html>
