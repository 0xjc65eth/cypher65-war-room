# ═══════════════════════════════════════════════════════════════════════
#  CYPHER65 WAR ROOM — Render blueprint
# ═══════════════════════════════════════════════════════════════════════
# Deploy:  push to GitHub → Render → New Blueprint → select the repo.
#
# ⚠️ CRITICAL — do NOT switch the start command to gunicorn by itself:
#   _start_background_threads() (poll loop + hash-market warmup + donation
#   watcher + auto-backup) is deliberately gated behind
#   `if __name__ == "__main__"` in app.py. `python app.py` boots the
#   background workers AND serves HTTP. `gunicorn app:app` ALONE would serve
#   HTTP with NO polling — the dashboard would stay blank forever.
#
#   Multi-process option (services/workers.py): run the workers in a SEPARATE
#   process — `python -m services.workers` — alongside a gunicorn HTTP
#   process. NOTE: /api/stream (SSE live-push) fans out in-process only, so
#   in a two-process topology the dashboard relies on its 15s poll fallback
#   for fresh data (fine for telemetry). Prefer `python app.py` on the free
#   tier.
#
# ⚠️ SQLite persistence — $0 remote backup (recommended):
#   Free-tier filesystem is EPHEMERAL (wiped on redeploy/restart). To keep
#   user credentials/settings/alerts across deploys at ZERO cost, set:
#     GITHUB_TOKEN=<personal access token with gist scope>
#   The app auto-backs up data/war_room.sqlite (base64) to a private GitHub
#   gist every REMOTE_BACKUP_INTERVAL (code default 600s; this blueprint sets
#   300s) and restores it on boot when the DB is missing/empty. See
#   services/remote_backup.py.
#   The env vars are provisioned below (GITHUB_TOKEN is `sync: false` — the
#   real PAT goes in the Render dashboard, never in git). Full step-by-step:
#   docs/DEPLOYMENT_OPS.md → "Persistência no Render". Validate the live
#   setup with: python scripts/verify_remote_backup.py --roundtrip
#   (Paid alternative: Persistent Disk + `plan: starter` — see git history.)
services:
  - type: web
    name: cypher65-war-room
    runtime: python
    plan: free            # $0 — persistence via GITHUB_TOKEN remote backup (see above)
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: PORT
        value: 8765
      # ── Wallet to monitor (OPTIONAL — do not set a default address).
      #    Honest-telemetry premise: the app boots EMPTY and only starts
      #    showing data once the user connects their own wallet via the UI
      #    (⚡ CONNECT) or sets this var. Leave unset for a blank dashboard.
      # - key: BTC_ADDRESS
      #   value: your-bc1-address
      # - key: WORKER_NAME
      #   value: ""
      # ── Secrets ──────────────────────────────────────────────────────────
      - key: SECRET_KEY
        generateValue: true
      # Optional: API_KEY / TENANT_API_KEYS to lock the API behind auth.
      # Optional: SENTRY_DSN for error monitoring.
      # ── Paywall / licensing (Issue #256) ─────────────────────────────────
      # PRO_KEYS_DB=1 ATIVA o gate de licensing: features PRO (proximity,
      # monte_carlo) respondem 402 sem chave e o funil paywall_view →
      # key_activated começa a coletar (validado 17-Aug: 11/11 checks —
      # docs/MONETIZATION_BTC_PROGRAMS.md §10). Valor ESTÁTICO (não é
      # segredo). O job diagnose-render (execution-pipeline.yml) verifica o
      # 402 após o deploy — se remover esta var, o CI acusa gate em open mode.
      - key: PRO_KEYS_DB
        value: "1"
      # ── Bitcoin checkout — BTCPay recommended (Issue #330) ─────────────
      # All values are operator-specific and stay in the Render dashboard.
      # The app keeps the Bitcoin tab OFF until URL + API key + store id +
      # webhook secret are all present; a half-configured checkout must never
      # accept funds without being able to fulfill the license.
      # Runbook: docs/DEPLOYMENT_OPS.md → "Canal Bitcoin em produção".
      - key: BTCPAY_URL
        sync: false
      - key: BTCPAY_API_KEY
        sync: false
      - key: BTCPAY_STORE_ID
        sync: false
      - key: BTCPAY_WEBHOOK_SECRET
        sync: false
      # Keep 0 until the real settlement/idempotency runbook passes in the
      # target environment. Credentials alone never expose checkout.
      - key: BTCPAY_RECONCILIATION_VERIFIED
        value: "0"
      - key: PAYMENT_BTC_ADDRESS
        sync: false
      # Legacy internal adapter only; never exposed as commercial checkout in
      # the beta. Payments require reconciled BTCPay.
      - key: LN_INVOICE_ENDPOINT
        sync: false
      # ── Web Push (VAPID) — Issue #15 ────────────────────────────────────
      # Push de alertas no browser só liga com um par de chaves VAPID.
      # Gere uma vez localmente e cole os valores REAIS no Render dashboard
      # (sync: false mantém as chaves FORA do git — nunca commitá-las):
      #   python -c "from py_vapid import Vapid; import base64;\
      #   from cryptography.hazmat.primitives import serialization as S;\
      #   v=Vapid(); v.generate_keys();\
      #   print(base64.urlsafe_b64encode(v.public_key.public_bytes(S.Encoding.X962,\
      #   S.PublicFormat.UncompressedPoint)).rstrip(b'=').decode());\
      #   print(base64.urlsafe_b64encode(v.private_key.private_numbers()\
      #   .private_value.to_bytes(32,'big')).rstrip(b'=').decode())"
      # VAPID_SUBJECT (mailto:) é opcional — quem o push service pode
      # contatar sobre expiração/política. Passo a passo completo:
      # docs/DEPLOYMENT_OPS.md → "Web Push (VAPID)".
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # ── $0 persistence: encrypted backup to an unlisted GitHub gist ───
      # `sync: false` provisions the key but NOT its value — set the real PAT
      # (scope `gist`) in the Render dashboard so the secret never hits git.
      # Gists are unlisted, not a confidentiality boundary. The app encrypts
      # every snapshot with REMOTE_BACKUP_ENCRYPTION_KEY before upload.
      - key: GITHUB_TOKEN
        sync: false
      - key: REMOTE_BACKUP_ENCRYPTION_KEY
        sync: false
      - key: REMOTE_BACKUP_INTERVAL
        value: "300"           # seconds between remote snapshots (default 300)
      # ── Hash market warmup / donation watch tuning (optional) ──────────
      # - key: POLL_INTERVAL
      #   value: "15"
    # ── Paid alternative: Persistent Disk (starter plan only) ────────────
    # disk:
    #   name: war-room-data
    #   mountPath: /opt/render/project/src/data
    #   sizeGB: 1
