# ── CYPHER65 War Room · Dependabot ───────────────────────────────────────
# Keep runtime/dev dependencies, GitHub Actions and the Docker base image
# patched. Weekly cadence for Python (low-noise), monthly for the Docker
# base image (immutable-tag workflows change less often).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "pip"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"

  # npm do app React Native (`mobile/`) — Issue #588.
  #
  # POR QUE ESTA ENTRADA EXISTE, e por que o cadence é DIÁRIO (diferente das
  # outras): sem ela, o pin do Expo só é atualizado à mão, e um patch publicado
  # pelo Expo deixa o job `mobile:` reprovando em TODO PR — o `expo-doctor`
  # exige a versão EXATA esperada para o SDK, e o `npm ci` do CI instala o que
  # o lockfile diz. O gate fica vermelho sem nenhuma mudança no código, o que é
  # o pior tipo de gate: o que se aprende a ignorar.
  #
  # A assinatura do problema (para reconhecer em 10 segundos): o job `mobile:`
  # reprova SÓ em "Expo SDK compatibility", com "Patch version mismatches" e
  # nada mais. Quando isso aparecer, o PR do bot já está aberto — mergear ele
  # destrava o resto.
  #
  # Semanal (como o pip) deixaria os PRs travados por até 7 dias esperando um
  # patch de terceiro. Diário fecha essa janela em ~1 dia; o limite de PRs
  # abertos mantém a fila curta.
  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "npm"
    # ── Ignore de major/minor nas dependências GERENCIADAS PELO EXPO ──────
    #
    # Um bump aqui não é "atualização": é o job `mobile:` reprovando em TODO
    # PR. O `mobile:` é required status check do ruleset, então o master trava
    # inteiro — foi o incidente da Issue #602 (react 19.2.3 → 19.3.0 e
    # gesture-handler 2.32 → 3.3.0 mergeados pelo bot).
    #
    # Por que ignorar e não só confiar no CI: o `expo-doctor` exige a versão
    # esperada para o SDK instalado (`expo/bundledNativeModules.json`). Não há
    # versão "mais nova e compatível" para ele — ou é a esperada, ou reprova.
    # Major/minor desses pacotes é MIGRAÇÃO (ex.: subir o SDK 57 → 58), trabalho
    # humano deliberado, não PR de bot.
    #
    # Patch continua automatizado, e isso é o essencial: quando o Expo publica
    # um patch, ele muda as versões esperadas no bundledNativeModules e os
    # pacotes `expo-*` precisam acompanhar no MESMO ciclo. O cadence diário da
    # Issue #588 continua fazendo exatamente o que foi criado para fazer.
    #
    # A lista é o conjunto gerenciado pelo SDK (interseção com
    # `expo/bundledNativeModules.json`, 18 pacotes) mais `@types/react` e
    # `react-test-renderer`, que o doctor valida por acompanharem o `react`.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-async-storage/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
