name: 🚀 Execution Pipeline

# Full pipeline: validate → build image → integration → diagnose Render deploy.
# The real deploy is Render's native autoDeploy (render.yaml) on push to master;
# this pipeline verifies the release is healthy locally AND that the deployed
# bundle matches the commit (parity gate with a CDN-proof backend marker).
#
# Adapted to the real repo: default branch is `master`, the app entrypoint is
# `app.py` (port 8765), health is /api/healthz, and Docker Compose v2 is used
# (not the legacy `docker-compose` command).
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  # ── JOB 1: CODE VALIDATION ─────────────────────────────────────────────
  # Real merge gate: syntax + the full pytest suite (the same tests ci.yml
  # runs). Lint is advisory (continue-on-error) — the codebase is not yet
  # flake8/black-clean (measured: 814 flake8 violations / 43 files needing
  # black), so making it blocking would break every merge until a cleanup
  # lands. Flip `continue-on-error` to false once that cleanup is merged.
  validate:
    runs-on: ubuntu-latest
    # SECRET_KEY de TESTE (fixa, nunca usada em prod): services.auth.create_token()
    # recusa emitir JWT sem SECRET_KEY — o gate precisa dela para os testes de
    # auth/export isolation (mesmo fix aplicado em ci.yml).
    env:
      SECRET_KEY: "ci-test-secret-key-0123456789abcdef"
    steps:
      # fetch-depth: 0 — histórico completo: o mutation test dos fetchers
      # (tests/test_fetcher_units_mutations.py) extrai o tools.py PRÉ-FIX real
      # via `git show <merge>^` — depth 1 quebraria a suíte pytest.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # Property-based tests (NUM-002, Issue #605) — pinned to
          # requirements-dev.txt so CI matches local dev.
          pip install pytest pytest-cov hypothesis==6.168.0
      - name: Syntax gate (compileall)
        run: |
          python -m compileall -q app.py helpers.py config.py solo_mining.py core routes services axe_fleet agents || exit 1
      - name: Run test suite
        # NO pipe to tail here: GH Actions run: uses bash -e but NOT pipefail,
        # so `pytest ... | tail` would always exit 0 (false green). Full output
        # is fine in CI logs — the exit code must be pytest's own.
        run: |
          python -m pytest tests/ -q --cov=core --cov=routes --cov-report=term-missing
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          pip install flake8 black
          flake8 core/ routes/ services/ axe_fleet/ --count --max-complexity=12 --statistics || true
          black --check core routes services axe_fleet || true

  # ── JOB 2: BUILD THE DOCKER IMAGE + HEALTH CHECK ───────────────────────
  build-image:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: cypher65-ultimate:test
      - name: Run container and check health
        # #283: curl --retry absorbs the container's boot-time variance (a cold
        # Flask start can accept and reset the first connection → exit 56 flaky).
        run: |
          docker run -d -p 8765:8765 --name test-cypher cypher65-ultimate:test
          sleep 8
          curl -fsS --retry 5 --retry-delay 2 --retry-all-errors http://localhost:8765/api/healthz
          docker stop test-cypher && docker rm test-cypher

  # ── JOB 3: COMPOSE INTEGRATION ─────────────────────────────────────────
  integration:
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v7
      - name: Start services with docker compose
        run: |
          # Root-cause fix: the compose file bind-mounts ./data:/app/data. On a
          # fresh runner ./data does not exist, so Docker creates it owned by
          # root — but the container runs as the `cypher` system user
          # (UID<1000, see Dockerfile), which then cannot create the SQLite
          # file and the app dies at init_db ("unable to open database file"),
          # making every endpoint check fail with curl exit 7. Make the bind
          # source world-writable so the container can persist telemetry.
          mkdir -p data && chmod 777 data
          docker compose up -d --build
          sleep 10
      - name: Validate endpoints
        run: |
          set -e
          # Boot takes a moment (init_db + first poll) — retry healthz up to
          # 60s so a slow cold start doesn't flake the gate.
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8765/api/healthz >/dev/null 2>&1; then
              echo "healthz OK (attempt $i)"
              ok="1"
              break
            fi
            sleep 2
          done
          [ -n "$ok" ] || { echo "healthz never came up"; docker compose logs; exit 1; }
          echo "── healthz ──"
          curl -fsS http://localhost:8765/api/healthz
          echo ""
          echo "── index ──"
          curl -fsS -o /dev/null -w 'index=%{http_code}\n' http://localhost:8765/
          echo "── snapshot JSON shape ──"
          curl -fsS http://localhost:8765/api/snapshot | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert 'worker' in d and 'pool' in d; print('snapshot ok, keys:', sorted(d.keys())[:8])"
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  # ── JOB 4: DIAGNOSE RENDER DEPLOY (MASTER ONLY) ────────────────────────
  # Render autoDeploys on push to master (render.yaml). This job turns the old
  # placeholder "Deploy to production server" into a real release verification:
  #   1. CONTRACT (hard gate, scripts/verify_production.py): the backend that is
  #      LIVE serves what THIS commit's code writes. The expected snapshot schema
  #      is derived from app.py in the checkout, so the marker is specific to the
  #      commit being deployed and cannot go stale. It also covers the cloud scan
  #      guards (#570), the anonymous agent-token mint (#578) and the sha256 of
  #      the agent.py users download — routes no gate looked at before.
  #      Why it exists (Issue #576): the previous backend marker was a hardcoded
  #      string from an OLDER commit (the private-IP hint from #570), so the gate
  #      stayed green while the deploy served a backend that never carried the
  #      new `pool_detection` key — the feature shipped invisible in production.
  #      Issue #586 added `persistence · revoked_tokens_db` (a flag no longer
  #      only in render.yaml), `persistence · durabilidade` (a blacklist
  #      persistente num disco efêmero e sem backup do gist não é persistente) e
  #      `agent revoke anônimo` (a rota que derruba a frota não pode aceitar um
  #      POST anônimo). O validador sai com **3** quando a falha é de
  #      configuração e o processo live já é este commit: o loop para na hora em
  #      vez de repetir 20× (~8 min) para chegar no mesmo vermelho.
  #   2. healthz must answer 200 on the live URL (hard gate — prod down fails).
  #   3. The served /static/app.js must byte-match the commit (soft gate — the
  #      deploy is async, so we retry up to ~9 min; Render build typically
  #      lands in 2-5 min).
  diagnose-render:
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
      - name: Backend contract — schema do commit deployado (Issue #576)
        run: |
          BASE="https://cypher65-war-room.onrender.com"
          ok=""
          # `--schema-wait 0`: este loop JÁ é o retry. Deixar os 45s internos
          # ligados aninharia as duas esperas (20 × ~50s ≈ 17 min, não os 8 min
          # que este comentário prometia). Um app recém-subido que ainda não
          # pollou falha aqui e converge na tentativa seguinte, 25s depois.
          for i in $(seq 1 20); do  # 20 × ~25s ≈ 8 min for the async build
            echo "── tentativa $i ──"
            python3 scripts/verify_production.py --base-url "$BASE" \
                 --skip-bundle --schema-wait 0
            code=$?
            if [ "$code" -eq 0 ]; then
              ok="1"; break
            fi
            # Exit 3 = o processo live JÁ é este commit e um check DURÁVEL está
            # vermelho (ex.: persistência ligada sem o backup remoto do gist, ou
            # a flag no render.yaml e não no processo). Repetir não muda nada:
            # parar agora, com o motivo no relatório acima.
            if [ "$code" -eq 3 ]; then
              echo "⛔ falha DURÁVEL (exit 3) — retry não conserta; parando o loop."
              break
            fi
            sleep 25
          done
          if [ -z "$ok" ]; then
            echo "❌ o backend deste commit NÃO está live (schema/guards/paridade do agente)."
            echo "   Ver o relatório acima: cada check traz o motivo exato."
            echo "   Check: https://dashboard.render.com → cypher65-war-room → deploys"
            exit 1
          fi
      - name: Diagnose Render deploy
        run: |
          BASE="https://cypher65-war-room.onrender.com"
          set -e

          # 1) healthz — hard gate
          echo "── 1. healthz (live) ──"
          ok=""
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/healthz" 2>/dev/null || echo 000)
            echo "  attempt $i: healthz=$code"
            if [ "$code" = "200" ]; then ok="1"; break; fi
            sleep 20
          done
          [ -n "$ok" ] || { echo "❌ Render healthz never returned 200 — production is DOWN"; exit 1; }
          echo "  ✅ healthz OK"

          # 2) paywall gate — hard gate (Issue #256)
          # PRO_KEYS_DB=1 lives in render.yaml (infra-as-code). The blueprint
          # sync applies env changes on push to master, but can lag the build
          # by a few minutes — retry mirrors healthz's semantics. 402 = gate
          # ACTIVE (paid features locked + funnel collecting); 200 = open mode
          # (paywall NOT active — something reverted the env var).
          # NOTE: the probe assumes no API auth (API_KEY/TENANT_API_KEYS) is
          # configured — if those are ever enabled, send the key here too.
          echo "── 2. paywall gate (PRO_KEYS_DB=1 → /api/proximity=402) ──"
          gate=""
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/api/proximity" 2>/dev/null || echo 000)
            echo "  attempt $i: proximity=$code"
            if [ "$code" = "402" ]; then gate="1"; break; fi
            sleep 20
          done
          if [ -n "$gate" ]; then
            echo "  ✅ paywall ativo — PRO_KEYS_DB=1 aplicado (402 em feature PRO)"
          else
            echo "❌ paywall em OPEN MODE (proximity != 402) — PRO_KEYS_DB=1 não aplicado."
            echo "   Causa provável: sync do blueprint pendente. Faça:"
            echo "   https://dashboard.render.com → cypher65-war-room → Blueprint → Sync now"
            echo "   (a env var já está no render.yaml — o sync a aplica; depois re-run este job)"
            exit 1
          fi

          # 3) bundle parity — soft gate with retry
          local_md5=$(md5sum static/app.js | awk '{print $1}')
          echo "── 3. bundle parity (local app.js md5=$local_md5) ──"
          match=""
          for i in $(seq 1 27); do  # 27 × 20s ≈ 9 min for the async build
            live_md5=$(curl -s --max-time 25 "$BASE/static/app.js" --compressed 2>/dev/null | python3 -c "import sys,hashlib,gzip; d=sys.stdin.buffer.read(); d=gzip.decompress(d) if d[:2]==b'\x1f\x8b' else d; print(hashlib.md5(d).hexdigest())" 2>/dev/null || echo "")
            echo "  check $i: live=$live_md5"
            if [ "$live_md5" = "$local_md5" ]; then match="1"; break; fi
            sleep 20
          done
          if [ -n "$match" ]; then
            echo "  ✅ served bundle matches this commit"
            exit 0
          fi

          # Sem marcador hardcoded aqui: o passo "Backend contract" já provou
          # que o backend DESTE commit está live (o schema esperado é derivado
          # do app.py do checkout). Um marcador com texto de outro commit é o
          # que manteve este gate verde com o #576 quebrado em produção.
          echo "❌ bundle servido não bate com $local_md5 após ~9 min."
          echo "   Backend: OK (o passo 'Backend contract' passou)."
          echo "   Causa provável: /static/app.js servido do cache do CDN, ou build de estático pendente."
          echo "   Check: https://dashboard.render.com → cypher65-war-room → deploys"
          exit 1
