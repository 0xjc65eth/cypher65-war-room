# ── CYPHER65 · CI Gate ───────────────────────────────────────────────────
# Runs the full test suite (Python + JS core) on every push and pull request
# to master (the default/active branch). This is the merge gate: if either
# suite fails, the PR is blocked.
# Coverage is regenerated each run and uploaded as an artifact.
#
# Audit item (Produção · Estágio 1/5): sem gate de CI, a cobertura não era
# mensurada e nenhuma falha bloqueava merge. Este workflow fecha o gap.
#
# COVERAGE MILESTONES (pytest --cov local, targets app/helpers/
# axe_fleet/services/core):
#   2026-08-01  TOTAL 53% (baseline)  · gate --cov-fail-under=45
#   2026-08-03  TOTAL 66% (+108 testes: ai_operator, session_manager,
#              push_notifier, cgminer_adapter, proximity) · gate sobe p/ 65%
# O --cov-fail-under=65 é o gate real: abaixo de 65% o merge é bloqueado.
# A margem (66% → 65%) absorve variação entre ambientes (CI vs local) sem
# deixar o gate frouxo.

name: "CI · Gate"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  gate:
    name: "pytest + JS core"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # SECRET_KEY de TESTE (fixa, nunca usada em prod): services.auth.create_token()
    # recusa emitir JWT sem SECRET_KEY, e testes de auth/export isolation dependem
    # disso no CI (localmente roda-se com a mesma env var). Chave de teste apenas.
    env:
      SECRET_KEY: "ci-test-secret-key-0123456789abcdef"

    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run JS core tests (app.js helpers)
        run: node --test tests/test_app_js_core.js

      # DOM regression guards (Issue #58) — bloqueiam merge quando:
      #   GUARD 1: templates/*.html têm id="" duplicado (quebra querySelector)
      #   GUARD 2: innerHTML interpola campo de registro externo sem
      #            escapeHtml (vetor de XSS — severity/category/msg/etc.)
      #   --report (Issue #68): além de bloquear, imprime o 📊 DOM Guard
      #            Report (counts TL/concat/insertAdjacentHTML/bare-id/
      #            textContent por PR) — annotation no checks UI + step
      #            summary, base para monitorar tendência de superfície XSS.
      #            A linha GUARD_REPORT {...} é persistida como artifact
      #            (dom-guard-report) para a linha do tempo por PR.
      # set +e + `exit $EXIT`: preserva o exit code do guard (bloqueio) mesmo
      # quando o artifact precisa ser gravado antes de falhar o step.
      - name: DOM regression guards (dup ids + innerHTML escaping) + report
        run: |
          set +e
          node scripts/check-dom-regression.cjs --report | tee /tmp/guard-report.log
          EXIT=$?
          grep 'GUARD_REPORT' /tmp/guard-report.log | sed 's/^GUARD_REPORT //' > /tmp/guard-report.json || true
          echo "guard exit: $EXIT · artifact: $(cat /tmp/guard-report.json 2>/dev/null)"
          exit $EXIT

      - name: Upload DOM guard report (trend)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dom-guard-report
          path: /tmp/guard-report.json
          if-no-files-found: ignore
          retention-days: 30

      # Self-test of the guard itself (Issue #60): runs the REAL guard as a
      # subprocess against disposable fixtures (XSS injetado → FAIL, id
      # duplicado → FAIL, fmt.diff sem escape → FAIL, baseline → PASS) para
      # que enfraquecer o guard nunca passe despercebido.
      - name: DOM guards self-test
        run: node tests/test_dom_guards.js

      # Mobile XSS guards (Issue #70) — mesma filosofia do guard web, para o
      # app React Native (mobile/). Bloqueia merge quando um vetor RN é
      # introduzido:
      #   - WebView source={{ html: … }} / source={{ html }} / injectedJavaScript
      #     — valores com interpolação ${…} de dado externo SEM builder
      #     whitelisted (escapeHtml/buildSafeHtml/sanitizeHtml/…)
      #   - dangerouslySetInnerHTML / react-native-render-html (review gate)
      #   - eval( / new Function( — banned
      #   - Linking.openURL('javascript:…') / uri javascript: / URL interpolada
      # Hoje o mobile/ tem 0 achados — rede de prevenção contra regressões.
      - name: Mobile XSS guards (RN sinks)
        run: node scripts/check-mobile-xss.cjs

      # Self-test do próprio guard mobile (Issue #70): fixtures adversárias
      # (TL cru → FAIL, builder → PASS, eval → FAIL, literal → PASS, …).
      - name: Mobile XSS guard self-test
        run: node tests/test_mobile_xss_guards.js

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Run Python tests with coverage
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --tb=short --junitxml=/tmp/pytest-results.xml \
            --cov=app --cov=helpers --cov=axe_fleet --cov=services --cov=core \
            --cov-report=term-missing --cov-report=html:/tmp/coverage_html \
            --cov-report=xml:/tmp/coverage.xml \
            --cov-fail-under=65

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest-results.xml
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: /tmp/coverage_html
          retention-days: 30

      # Codecov (Issue #28) — repo público = free tier. O upload exige o
      # CODECOV_TOKEN (repo secret): sem ele o CLI falha com
      # 'Token required - not valid tokenless upload' (log: Token length: 0).
      # fail_ci_if_error:false garante que um CI sem secret nunca bloqueie o
      # merge — o upload simplesmente fica pendente até o token existir.
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: /tmp/coverage.xml
          fail_ci_if_error: false
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: 0xjc65eth/cypher65-war-room
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "::error::CI gate FAILED — merge blocked"
          echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  mobile:
    name: "mobile: typecheck + jest"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No lockfile committed yet, so npm install (not npm ci).
      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Run jest suite
        run: npm test -- --ci

      # Lint/quality (Issue #29) — advisory: report violations but never
      # block the merge. The real JS gate stays tests/test_app_js_core.js.
      - name: Biome lint (advisory)
        continue-on-error: true
        run: npx @biomejs/biome lint src App.tsx --reporter=summary || true

      - name: Knip dead-code (advisory)
        continue-on-error: true
        run: npx knip --reporter=compact || true

  # E2E Playwright (Issue #28) — boots the real app and runs the browser
  # suite on chromium. Kept in its own job so the fast gate isn't slowed.
  e2e:
    name: "e2e: playwright chromium"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./

    env:
      SECRET_KEY: "ci-test-secret-key-0123456789abcdef"
      RATE_LIMIT_PER_MINUTE: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm install
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # Browsers SEM sudo: cache fica no HOME do runner (/home/runner/.cache/ms-playwright).
      # Com sudo o HOME vira /root e o runtime não acha o binário → launch fail.
      - name: Install Playwright browsers
        run: |
          npx playwright install chromium
          sudo npx playwright install-deps chromium

      - name: Boot app + run e2e specs
        run: |
          source .venv/bin/activate
          nohup python app.py &> /tmp/e2e_server.log &
          echo "PID=$!"
          for i in $(seq 1 30); do
            sleep 1
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/healthz 2>/dev/null || echo 000)
            if [ "$STATUS" = "200" ]; then echo "server ready after ${i}s"; break; fi
          done
          npx playwright test tests/e2e/dashboard.spec.js tests/e2e/modals.spec.js \
            tests/e2e/alert-center-tabs.spec.js tests/e2e/rentals.spec.js \
            --project=chromium

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e-report
          if-no-files-found: ignore
          retention-days: 14
