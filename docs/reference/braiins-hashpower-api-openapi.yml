      properties:
        price_sat:
          $ref: "#/components/schemas/Double"
          description: Price of the bid item.
        amount_sat:
          $ref: "#/components/schemas/Double"
          description: Amount in market currency available to purchase hashrate.
        hr_matched_ph:
          $ref: "#/components/schemas/Double"
          description: Hashrate being matched at this level, estimated over a 10-minute window, in PH/s.
        speed_limit_ph:
          $ref: "#/components/schemas/Double"
          description: Aggregated hashrate limit at this level. Zero means no limit. In PH/s.
        degraded_bids_count:
          $ref: "#/components/schemas/Uint32"
