      operationId: getContractReservations
      x-required-acl: [owner, read-only]
      x-rate-limit: 100 requests/minute per API credential
      parameters:
        - name: contract_id
          in: path
          required: true
          description: Contract ID prefixed with C.
          schema:
            type: string
            pattern: '^C[0-9]+$'
            examples:
              - C123456789
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetContractReservationsResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/ServiceError" }
  /contract/{contract_id}/settlement:
    get:
      summary: List settlement history for a caller-owned contract
      description: |-
        Returns daily settlement records for the contract, including delivered value, fees, indicative PPS rate, and any cancellation settlement data. Zero-share rows represent completed accounting days without delivery.

        **Access:** API key required; allowed ACLs: `owner`, `read-only`.

        **Rate limit:** 100 requests/minute per API credential.
      tags: [Contracts]
      operationId: getContractSettlements
      x-required-acl: [owner, read-only]
      x-rate-limit: 100 requests/minute per API credential
      parameters:
        - name: contract_id
          in: path
          required: true
