      properties:
        price_sat:
          $ref: "#/components/schemas/Double"
          description: Price of the ask item.
        hr_matched_ph:
          $ref: "#/components/schemas/Double"
          description: Hashrate being matched at this level, estimated over a 10-minute window, in PH/s.
        hr_available_ph:
          $ref: "#/components/schemas/Double"
          description: Hashrate available for sale at this level, estimated over a 10-minute window, in PH/s.
