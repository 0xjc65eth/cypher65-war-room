          examples:
            - 18
        hr_unit:
          type: string
          description: Human readable market log10 multiplier, e.g. 18 -> "EH/day", 17 -> "100PH/day"
          examples:
            - EH/day
            - 100PH/day
            - 10PH/day
        min_bid_price_sat:
          $ref: "#/components/schemas/Double"
        max_bid_price_sat:
          $ref: "#/components/schemas/Double"
        min_ask_price_sat:
          $ref: "#/components/schemas/Double"
        max_ask_price_sat:
          $ref: "#/components/schemas/Double"
        min_bid_amount_sat:
          $ref: "#/components/schemas/Double"
          description: Minimum bid amount for bids with no hashrate limit in satoshi.
        max_bid_amount_sat:
          $ref: "#/components/schemas/Double"
          description: Maximum bid amount for bids with no hashrate limit in satoshi.
        min_bid_speed_limit_ph:
